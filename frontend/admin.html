<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediSign — Admin Dashboard</title>
  <meta name="description" content="Admin panel to issue doctor certificates and view audit logs"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="page">

  <!-- Navbar -->
  <nav class="navbar">
    <span class="logo"> MediSign Admin</span>
    <div style="display:flex; gap:12px; align-items:center;">
      <span class="nav-info" id="adminName">System Administrator</span>
      <button class="btn btn-ghost" onclick="logout()" style="padding:7px 16px; font-size:0.85rem;">Logout</button>
    </div>
  </nav>

  <div class="section">

    <!-- Issue Certificate -->
    <div class="card glass" style="margin-bottom:28px;">
      <h2 class="heading" style="font-size:1.3rem; margin-bottom:4px;">Issue Doctor Certificate</h2>
      <p class="sub" style="margin-bottom:24px;">Generate RSA keys, hash password, and register a new doctor.</p>

      <form id="issueForm">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="iName">Full Name</label>
            <input id="iName" class="input" type="text" placeholder="Dr. Jane Smith" required/>
          </div>
          <div class="form-group">
            <label for="iEmail">Email</label>
            <input id="iEmail" class="input" type="email" placeholder="doctor@hospital.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label for="iPassword">Password</label>
          <input id="iPassword" class="input" type="password" placeholder="Set a secure password" required/>
        </div>
        <button id="issueBtn" class="btn btn-primary" type="submit">Issue Certificate</button>
      </form>
      <div class="alert" id="issueAlert"></div>
    </div>

    <!-- Doctors list -->
    <div class="card glass" style="margin-bottom:28px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 class="heading" style="font-size:1.3rem;">Registered Doctors</h2>
        <button class="btn btn-ghost" onclick="loadDoctors()" style="padding:7px 16px; font-size:0.85rem;">↻ Refresh</button>
      </div>
      <div class="table-wrapper">
        <table id="doctorsTable">
          <thead>
            <tr><th>Doctor ID</th><th>Name</th><th>Email</th><th>Created At</th></tr>
          </thead>
          <tbody id="doctorsBody">
            <tr><td colspan="4" style="color:var(--text-muted); text-align:center;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Audit logs -->
    <div class="card glass">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 class="heading" style="font-size:1.3rem;">Audit Trail</h2>
        <div style="display:flex; gap:10px; align-items:center;">
          <input id="filterDoc" class="input" type="text" placeholder="Filter by Doctor ID" style="width:180px; padding:8px 12px;"/>
          <button class="btn btn-ghost" onclick="loadLogs()" style="padding:7px 16px; font-size:0.85rem;">↻ Load</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Doctor ID</th><th>Action</th><th>Document ID</th><th>Timestamp</th><th>IP</th></tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="5" style="color:var(--text-muted); text-align:center;">Click Load to fetch logs.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
